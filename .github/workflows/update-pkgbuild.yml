name: AUR CI
on:
  # Only run manually: requires DEPLOY_KEY secret (AUR SSH deploy key)
  # configured in repository Settings -> Secrets and variables -> Actions.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: chitang233/aur-pkgbuild-builder@main
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          package_name: 'nekoray-git'